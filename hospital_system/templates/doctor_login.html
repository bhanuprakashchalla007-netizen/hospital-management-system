        * {

<body>

<div class="container">

    <div class="brand">
        <div class="brand-icon">👨‍⚕️</div>

        <h1>Hospital Management</h1>

        <p>Secure Doctor Portal</p>
    </div>


    <div class="login-card">

        <h2>Doctor Login</h2>

        <p class="subtitle">
            Sign in to manage appointments and patients.
        </p>


        <div id="message" class="message"></div>


        <form id="loginForm">

            <div class="form-group">

                <label for="doctorId">
                    Doctor ID / Email
                </label>

                <input
                    type="text"
                    id="doctorId"
                    placeholder="Enter your doctor ID or email"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()">
                        👁️
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn">

                Sign In

            </button>

        </form>


        <div class="security">
            🔒 Doctor accounts are protected by secure
            authentication.
        </div>

    </div>


    <div class="back">
        <a href="/">← Back to Hospital Portal</a>
    </div>

</div>


<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    password.type =
        password.type === "password"
        ? "text"
        : "password";
}


document.getElementById(
    "loginForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const doctorId =
            document.getElementById(
                "doctorId"
            ).value.trim();

        const password =
            document.getElementById(
                "password"
            ).value;

        const button =
            document.getElementById(
                "loginBtn"
            );

        const message =
            document.getElementById(
                "message"
            );


        message.style.display = "none";

        button.disabled = true;

        button.textContent = "Signing in...";


        try {

            const response =
                await fetch(
                    "/doctor/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            doctor_id: doctorId,
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (data.success) {

                window.location.href =
                    "/doctor/dashboard";

                return;
            }


            message.textContent =
                data.message ||
                "Invalid doctor credentials.";

            message.className =
                "message error";


        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to the server.";

            message.className =
                "message error";

        } finally {

            button.disabled = false;

            button.textContent = "Sign In";

        }

    }
);

</script>

</body>
</html>
